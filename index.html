<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17365f">
  <meta name="description" content="学校向け教育課程編成支援PWA。年間カレンダー、授業時数、時間割編成、臨時変更、帳票を一体化。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>教育課程編成支援 School</title>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="kicker">CURRICULUM PLANNER</div>
      <h1>教育課程編成支援<br>School</h1>
      <div class="ver">v1.2.0 / PWA・学校単独版</div>
    </div>
    <div id="nav"></div>
    <div class="storage-card" id="storageCard"><span class="lamp"></span><strong>端末内に自動保存</strong><br>Drive同期は任意。学校の編集はオフラインでも継続できます。</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <strong id="topSchool">学校未設定</strong>
        <span id="topMeta">年度未設定</span>
      </div>
      <div class="top-actions">
        <span class="chip ok" id="onlineChip">● オフライン対応</span>
        <span class="chip info" id="saveChip">自動保存</span>
        <button class="btn" id="installBtn" hidden>PWAをインストール</button>
        <button class="btn" data-action="openDrive">Drive</button>
        <button class="btn" data-action="exportJson">バックアップ</button>
      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="toast-wrap" id="toasts"></div>
<div id="modalRoot"></div>
<script type="module" src="./app.js?v=1.2.0"></script>
</body>
</html>
