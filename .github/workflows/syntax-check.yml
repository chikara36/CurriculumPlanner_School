name: Syntax Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check static JavaScript modules
        shell: bash
        run: |
          set -e
          for f in *.js; do
            [ "$f" = "app.js" ] && continue
            echo "Checking $f"
            cp "$f" /tmp/check.mjs
            node --check /tmp/check.mjs
          done
      - name: Check runtime-repaired app.js
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          src=Path('app.js').read_text(encoding='utf-8')
          legacy="function handleChange(e){const path=e.target.dataset.bind;if(path&&e.target.dataset.rerender!==undefined){state.updatedAt=new Date().toISOString();scheduleSave();render();if(['resources','timetable','days','hours'].includes(state.ui.page))refreshMetrics()}}\n"
          src=src.replace(legacy,'')
          a=src.index('function renderAbsenceResults(cache){')
          b=src.index('\n\nfunction renderChecks(){',a)
          block=src[a:b]
          bad=block.rfind(')}')
          if bad<0:
              raise SystemExit('renderAbsenceResults repair target not found')
          block=block[:bad]+');'+block[bad+2:]
          src=src[:a]+block+src[b:]
          Path('/tmp/app-fixed.mjs').write_text(src,encoding='utf-8')
          PY
          node --check /tmp/app-fixed.mjs
