name: Syntax Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript modules
        shell: bash
        run: |
          set -e
          for f in *.js; do
            echo "Checking $f"
            cp "$f" /tmp/check.mjs
            node --check /tmp/check.mjs
          done
      - name: Regression tests
        run: node tests/regression.mjs

      - name: Daily teaching actuals regression
        run: node tests/actuals.mjs

      - name: Weekly multi-teacher replan tests
        run: node tests/weekly.mjs

      - name: Startup smoke test
        run: node tests/startup-smoke.mjs

      - name: Architecture and solver consistency tests
        run: node tests/architecture.mjs
      - name: Install Playwright for Chrome E2E
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Real Chrome end-to-end UI tests
        run: node tests/browser-e2e.mjs
      - name: Upload browser screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: artifacts/browser-failure.png
          if-no-files-found: ignore
